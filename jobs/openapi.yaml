openapi: 3.0.3
info:
  title: Text analysis demo
  version: 1.0.0
paths:
  /healthz:
    get:
      operationId: health
      x-encore: { expose: true }
      responses:
        '204': { description: Healthy }
  /jobs:
    post:
      operationId: submitJob
      x-encore: { expose: true }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitJob' }
      responses:
        '202':
          description: Job stored and submission published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Identity' }
        '400': { description: Invalid job or JSON; body limited to 16KiB }
        '429': { description: Environment admission budget exhausted (128 jobs; no refill) }
        '500': { description: Internal error; a committed job may remain queued if publishing fails }
  /jobs/{id}:
    get:
      operationId: getJob
      x-encore: { expose: true }
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
      responses:
        '200':
          description: Job status and, when completed, its analysis result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '400': { description: Invalid ID }
        '404': { description: Job not found }
        '500': { description: Internal error }
  /internal/demo/jobs:
    post:
      operationId: submitDemoJob
      summary: Submit an analysis with demo controls
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitDemoJob' }
      responses:
        '202':
          description: Job stored and submission published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Identity' }
        '400': { description: Invalid submission }
        '429': { description: Environment admission budget exhausted }
        '500': { description: Internal error }
  /internal/demo/database-error:
    post:
      operationId: demoDatabaseError
      summary: Deliberately fail a database transaction
      responses:
        '500': { description: Deliberate database failure }
  /internal/reconcile:
    post:
      operationId: reconcileJobs
      summary: Republish stale queued jobs
      responses:
        '200':
          description: Reconciliation finished
          content:
            application/json:
              schema:
                type: object
                required: [republished]
                properties:
                  republished: { type: integer, minimum: 0, maximum: 16 }
        '500': { description: Reconciliation failed }
components:
  schemas:
    Identity:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
    SubmitJob:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { $ref: '#/components/schemas/AnalysisText' }
    SubmitDemoJob:
      type: object
      description: Slow mode runs pg_sleep; retry-once fails its first durable attempt.
      additionalProperties: false
      required: [text]
      properties:
        text: { $ref: '#/components/schemas/AnalysisText' }
        mode: { type: string, enum: [normal, slow, retry-once], default: normal }
        delay_ms: { type: integer, minimum: 0, maximum: 500, default: 0 }
        log_count: { type: integer, minimum: 3, maximum: 250, default: 3 }
    AnalysisText:
      type: string
      maxLength: 4096
      description: At most 4096 UTF-8 bytes; empty allowed; NUL and malformed UTF-8 rejected
      x-encore: { sensitive: true }
    Job:
      type: object
      required: [id, status]
      additionalProperties: false
      properties:
        id: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
        status: { type: string, enum: [queued, processing, completed] }
        result: { $ref: '#/components/schemas/AnalysisResult' }
    AnalysisResult:
      type: object
      description: Present only when the job is completed.
      required: [word_count]
      additionalProperties: false
      properties:
        word_count:
          type: integer
          minimum: 0
          description: Number of non-empty runs separated by Unicode whitespace.
