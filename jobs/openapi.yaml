openapi: 3.0.3
info:
  title: Encore demo app
  version: 1.0.0
paths:
  /healthz:
    get:
      operationId: health
      x-encore: { expose: true }
      responses:
        '204': { description: Healthy }
  /jobs:
    post:
      operationId: submitJob
      x-encore: { expose: true }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitJob' }
      responses:
        '202':
          description: Job stored and submission published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Identity' }
        '400': { description: Invalid job or JSON; body limited to 16KiB }
        '409': { description: Job ID already exists }
        '429': { description: Environment admission budget exhausted (128 jobs; no refill) }
        '500': { description: Internal error; a committed job may remain queued if publishing fails }
  /jobs/{id}:
    get:
      operationId: getJob
      x-encore: { expose: true }
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
        - in: query
          name: fail
          description: Deliberately fail a database transaction for observability testing.
          schema: { type: string, enum: [db] }
      responses:
        '200':
          description: Durable job state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '400': { description: Invalid ID or failure option }
        '404': { description: Job not found }
        '500': { description: Internal error or deliberate database failure }
components:
  schemas:
    Identity:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
    SubmitJob:
      type: object
      description: Only id and payload are required. Optional fields are non-null and use defaults when omitted. Slow mode runs pg_sleep; retry-once fails its first durable attempt.
      additionalProperties: false
      required: [id, payload]
      properties:
        id: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
        payload: { type: string, nullable: false, maxLength: 4096, description: At most 4096 UTF-8 bytes; empty allowed; NUL and malformed UTF-8 rejected }
        mode: { type: string, enum: [normal, slow, retry-once], default: normal }
        delay_ms: { type: integer, minimum: 0, maximum: 500, default: 0 }
        log_count: { type: integer, minimum: 3, maximum: 250, default: 3 }
    Job:
      type: object
      required: [id, status, attempts, completion_confirmed, payload_sha256]
      additionalProperties: false
      properties:
        id: { type: string }
        status: { type: string, enum: [queued, processing, completed] }
        attempts: { type: integer, minimum: 0 }
        completion_confirmed: { type: boolean }
        payload_sha256: { type: string, pattern: '^[0-9a-f]{64}$', description: SHA-256 of the stored payload UTF-8 bytes }
